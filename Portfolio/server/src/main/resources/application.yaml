spring:
  application:
    name: portfolio

  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  address: 0.0.0.0
  port: ${PORT:3333}
  servlet:
    context-path: /api/
